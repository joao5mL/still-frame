<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame Extractor</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#0a0a0a;color:#fff;min-height:100vh;}
header{padding:24px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:700;font-size:18px;letter-spacing:-0.5px;}
.logo span{color:#3b82f6;}
.badge{font-size:11px;background:#151515;border:1px solid #222;padding:4px 8px;border-radius:20px;color:#888;}
.container{max-width:1000px;margin:0 auto;padding:20px;}
.drop{margin-top:30px;border:1.5px dashed #2a2a2a;background:#111;border-radius:16px;padding:50px 20px;text-align:center;cursor:pointer;transition:.2s;}
.drop:hover{border-color:#3b82f6;background:#12141a;}
.drop h2{font-size:20px;font-weight:600;margin-bottom:8px;}
.drop p{color:#666;font-size:14px;}
#video{display:none;width:100%;border-radius:12px;margin-top:20px;background:#000;}
.controls{display:none;margin-top:20px;background:#121212;border:1px solid #1e1e1e;border-radius:14px;padding:16px;gap:10px;flex-wrap:wrap;}
.controls.show{display:flex;align-items:end;}
.ctrl{flex:1;min-width:110px;}
.ctrl label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
.ctrl select{background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;border-radius:8px;padding:10px 12px;width:100%;outline:none;}
.btn{background:#fff;color:#000;border:none;padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;transition:.2s;font-size:14px;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);opacity:.9;}
.btn-blue{background:#3b82f6;color:#fff;}
.btn-ghost{background:#1a1a1a;color:#fff;border:1px solid #2a2a2a;}
.btn-yellow{background:#eab308;color:#000;}
.btn:disabled{opacity:.4;pointer-events:none;}
.top-actions{display:none;margin-top:20px;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.top-actions.show{display:flex;}
.count{color:#888;font-size:13px;}
.gallery{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.card{background:#121212;border:1px solid #1e1e1e;border-radius:12px;overflow:hidden;}
.card img{width:100%;height:auto;max-height:320px;object-fit:contain;display:block;background:#000;}
.card-foot{padding:8px;display:flex;gap:6px;}
.card-foot button{flex:1;padding:7px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
.download{background:#fff;color:#000;}
.time{flex:1;background:#1e1e1e;color:#aaa;text-align:center;padding:7px;border-radius:7px;font-size:11px;font-family:monospace;cursor:pointer;}
.progress{height:3px;background:#1a1a1a;border-radius:10px;margin-top:16px;overflow:hidden;display:none;}
.progress i{display:block;height:100%;background:#3b82f6;width:0%;transition:.2s;}
.video-actions{display:none;margin-top:12px;gap:8px;}
.video-actions.show{display:flex;}
</style>
</head>
<body>
<header><div class="logo">FRAME<span>.EXTRACTOR</span></div><div class="badge">v1.2 • pause + troca</div></header>
<div class="container">
<div class="drop" id="drop"><h2>Solte o vídeo aqui</h2><p>MP4, MOV, WEBM • até 4K • 100% offline</p><input type="file" id="file" accept="video/*" hidden></div>
<video id="video" controls muted></video>
<div class="video-actions" id="videoActions"><button class="btn btn-ghost" id="changeBtn">🔄 Trocar vídeo</button><span class="count" id="videoInfo"></span></div>
<div class="progress" id="progress"><i id="bar"></i></div>
<div class="controls" id="controls">
<div class="ctrl"><label>Intervalo</label><select id="interval"><option value="0.1">100ms</option><option value="0.25">250ms</option><option value="0.5">0.5s</option><option value="1" selected>1s</option><option value="2">2s</option><option value="5">5s</option></select></div>
<div class="ctrl"><label>Formato</label><select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option></select></div>
<div class="ctrl"><label>Qualidade</label><select id="quality"><option value="0.92">Alta</option><option value="0.8" selected>Média</option><option value="0.6">Leve</option></select></div>
<button class="btn btn-blue" id="extractBtn">Extrair Frames</button>
<button class="btn btn-yellow" id="pauseBtn" style="display:none;">⏸️ Pausar</button>
</div>
<div class="top-actions" id="topActions"><div class="count" id="count">0 frames</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="clearBtn">Limpar</button><button class="btn" id="zipBtn">Baixar ZIP</button></div></div>
<div class="gallery" id="gallery"></div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const drop=document.getElementById('drop'), fileInput=document.getElementById('file'), video=document.getElementById('video'), canvas=document.getElementById('canvas'), gallery=document.getElementById('gallery'), extractBtn=document.getElementById('extractBtn'), pauseBtn=document.getElementById('pauseBtn'), intervalSel=document.getElementById('interval'), formatSel=document.getElementById('format'), qualitySel=document.getElementById('quality'), controls=document.getElementById('controls'), topActions=document.getElementById('topActions'), countEl=document.getElementById('count'), zipBtn=document.getElementById('zipBtn'), clearBtn=document.getElementById('clearBtn'), progress=document.getElementById('progress'), bar=document.getElementById('bar'), videoActions=document.getElementById('videoActions'), changeBtn=document.getElementById('changeBtn'), videoInfo=document.getElementById('videoInfo');
let frames=[], fileName='frame', isPaused=false, isExtracting=false, shouldStop=false;
function formatTime(t){const s=Math.floor(t); const ms=Math.floor((t-s)*1000); return `${s}s ${ms.toString().padStart(3,'0')}ms`;}
function formatFile(t){return `${t.toFixed(3)}s`.replace('.','_');}
function resetAll(){video.src=''; video.style.display='none'; controls.classList.remove('show'); videoActions.classList.remove('show'); gallery.innerHTML=''; frames=[]; topActions.classList.remove('show'); bar.style.width='0%'; progress.style.display='none'; drop.style.display='block'; isPaused=false; isExtracting=false; shouldStop=false; extractBtn.style.display='block'; pauseBtn.style.display='none'; extractBtn.textContent='Extrair Frames';}
drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#3b82f6'};
drop.ondragleave=()=>drop.style.borderColor='#2a2a2a';
drop.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f) loadFile(f)};
fileInput.onchange=e=>{if(e.target.files[0]) loadFile(e.target.files[0])};
changeBtn.onclick=()=>{resetAll(); fileInput.click();};
function loadFile(file){
 fileName=file.name.replace(/\.[^/.]+$/,'');
 const url=URL.createObjectURL(file);
 video.src=url; video.style.display='block'; controls.classList.add('show'); videoActions.classList.add('show'); drop.style.display='none';
 gallery.innerHTML=''; frames=[]; topActions.classList.remove('show');
 video.onloadedmetadata=()=>{ videoInfo.textContent=`${file.name} • ${video.duration.toFixed(2)}s`; countEl.textContent=`Vídeo: ${video.duration.toFixed(3)}s`; };
}
async function extract(){
 if(!video.duration || isExtracting) return;
 if(frames.length>0){ gallery.innerHTML=''; frames=[]; } // recomeça se já extraiu antes
 isExtracting=true; shouldStop=false; isPaused=false;
 extractBtn.style.display='none'; pauseBtn.style.display='block'; progress.style.display='block';
 const interval=parseFloat(intervalSel.value);
 const format=formatSel.value;
 const quality=parseFloat(qualitySel.value);
 const ctx=canvas.getContext('2d');
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 const total=Math.floor(video.duration/interval);
 for(let i=0;i<=total;i++){
  if(shouldStop) break;
  while(isPaused){ await new Promise(r=>setTimeout(r,200)); if(shouldStop) break; }
  const time=i*interval;
  if(time>video.duration) break;
  await seek(time);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL('image/'+format, quality);
  frames.push({time,dataUrl,index:i});
  bar.style.width=((i/total)*100)+'%';
  addCard({time,dataUrl,index:i}, format);
  countEl.textContent=`${frames.length} / ${total+1} frames`;
 }
 bar.style.width='100%';
 setTimeout(()=>progress.style.display='none',500);
 countEl.textContent=`${frames.length} frames extraídos`;
 topActions.classList.add('show');
 isExtracting=false; extractBtn.style.display='block'; pauseBtn.style.display='none'; extractBtn.textContent='Extrair de novo';
}
function seek(t){return new Promise(res=>{video.currentTime=t; video.onseeked=()=>res();});}
function addCard(f, format){
 const div=document.createElement('div'); div.className='card';
 div.innerHTML=`<img src="${f.dataUrl}"><div class="card-foot"><button class="download">Baixar</button><div class="time">${formatTime(f.time)}</div></div>`;
 div.querySelector('.download').onclick=()=>{
  const a=document.createElement('a'); a.href=f.dataUrl; a.download=`${fileName}_${formatFile(f.time)}.${format==='jpeg'?'jpg':format}`; a.click();
 };
 div.querySelector('.time').onclick=()=>{ video.currentTime=f.time; video.scrollIntoView({behavior:'smooth'}); };
 gallery.appendChild(div);
}
extractBtn.onclick=extract;
pauseBtn.onclick=()=>{
 isPaused=!isPaused;
 pauseBtn.textContent=isPaused?'▶️ Continuar':'⏸️ Pausar';
 pauseBtn.className=isPaused?'btn btn-blue':'btn btn-yellow';
};
clearBtn.onclick=()=>{shouldStop=true; isPaused=false; gallery.innerHTML='';frames=[];topActions.classList.remove('show');bar.style.width='0%';countEl.textContent='0 frames'; isExtracting=false; extractBtn.style.display='block'; pauseBtn.style.display='none'; extractBtn.textContent='Extrair Frames';};
zipBtn.onclick=async()=>{
 if(!frames.length) return;
 zipBtn.textContent='Gerando ZIP...';
 const zip=new JSZip();
 const fmt=formatSel.value==='jpeg'?'jpg':formatSel.value;
 frames.forEach(f=>{
  const base64=f.dataUrl.split(',')[1];
  zip.file(`${fileName}_${formatFile(f.time)}.${fmt}`, base64, {base64:true});
 });
 const blob=await zip.generateAsync({type:'blob'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${fileName}_frames.zip`; a.click();
 zipBtn.textContent='Baixar ZIP';
};
</script>
</body>
</html>
